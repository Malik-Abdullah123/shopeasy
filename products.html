<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse and filter ShopEasy electronics.">
  <title>Products | ShopEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="ShopEasy home">Shop<span>Easy</span></a>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <div class="nav-links"><a href="index.html">Home</a><a class="active" href="products.html">Products</a><a href="cart.html">Cart <span class="cart-count" aria-label="Items in cart">0</span></a></div>
    </nav>
  </header>
  <main class="container page-main">
    <section class="page-intro"><p class="eyebrow">THE SHOP</p><h1>Find your next favourite.</h1><p>Useful tech, picked to make everyday life easier.</p></section>
    <section aria-labelledby="catalogue-heading">
      <h2 id="catalogue-heading" class="visually-hidden">Product catalogue</h2>
      <div class="catalogue-toolbar">
        <label class="search-field"><span class="visually-hidden">Search products</span><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search products..." autocomplete="off"></label>
        <label><span class="visually-hidden">Filter by category</span><select id="categoryFilter"><option value="all">All categories</option><option value="computers">Computers</option><option value="audio">Audio</option><option value="phones">Phones</option><option value="wearables">Wearables</option><option value="gaming">Gaming</option><option value="cameras">Cameras</option><option value="accessories">Accessories</option></select></label>
        <label><span class="visually-hidden">Sort products</span><select id="sortSelect"><option value="default">Featured order</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></label>
      </div>
      <p id="catalogueStatus" class="status-message" aria-live="polite">Loading products...</p>
      <div id="productGrid" class="product-grid" aria-live="polite"></div>
      <p id="emptyState" class="empty-state" hidden>No products match your search. Try another term or category.</p>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><a class="brand footer-brand" href="index.html">Shop<span>Easy</span></a><p>Good tech. Easy choices.</p><p>© <span class="current-year"></span> ShopEasy Student Demo</p></div></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
